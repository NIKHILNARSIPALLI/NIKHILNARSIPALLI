name: Refresh active and past projects

# Rebuild the two README project sections from public push activity.
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh README project sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_projects.py
      - name: Install animation dependency
        run: python3 -m pip install Pillow
      - name: Rebuild smooth engineering toolkit animation
        run: python3 scripts/build_toolkit_carousel.py
      - name: Rebuild seamless profile header animation
        run: python3 scripts/smooth_hero.py
      - name: Animate the point-cloud portrait
        run: python3 scripts/animate_point_cloud.py
      - name: Slow featured project animations without altering frames
        run: python3 scripts/retime_featured.py
      - name: Commit if anything changed
        run: |
          if ! git diff --quiet -- README.md assets/stack-carousel.gif assets/hero-future-optimized.gif assets/about-point-cloud-motion.webp assets/featured-telco.gif assets/featured-stocks.gif assets/featured-sentiment.gif; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md assets/stack-carousel.gif assets/hero-future-optimized.gif assets/about-point-cloud-motion.webp assets/featured-telco.gif assets/featured-stocks.gif assets/featured-sentiment.gif
            git commit -m "Refresh projects and smooth toolkit animation"
            git push
          fi
