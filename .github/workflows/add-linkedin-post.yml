name: Add LinkedIn post

on:
  workflow_dispatch:
    inputs:
      post_url:
        description: "LinkedIn post URL"
        required: true
        type: string
      title:
        description: "Optional short caption"
        required: false
        type: string
      image_url:
        description: "Optional direct public HTTPS image URL"
        required: false
        type: string
      post_date:
        description: "Optional display date"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: linkedin-tiles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Render post tiles
        env:
          POST_URL: ${{ inputs.post_url }}
          POST_TITLE: ${{ inputs.title }}
          POST_IMAGE: ${{ inputs.image_url }}
          POST_DATE: ${{ inputs.post_date }}
        run: python3 scripts/update_linkedin.py
      - name: Commit updated feed
        run: |
          if ! git diff --quiet -- README.md linkedin/posts.json assets/linkedin-post-*.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md linkedin/posts.json assets/linkedin-post-*.svg
            git commit -m "Update LinkedIn post tiles"
            git push
          fi
